# Build Sphinx HTML and publish to GitHub Pages.
# First enable Pages: Settings → Pages → Source = GitHub Actions.

name: docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "README.md"
      - "STATE.md"
      - "APPS.md"
      - "HANDOFF.md"
      - "src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # myst_parser can include repo-root markdown via relative paths from docs/
      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
